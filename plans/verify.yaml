  M5-S9: {city: prague, q: "city=prague&camera=chase", min: 4, client: w, expect: "Šikmý pohled za autem: obloha, výšky domů a kopce čitelné, přepnutí ◎/◢ bez cuknutí, plynulých 60 fps."}
