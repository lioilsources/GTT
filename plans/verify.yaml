  D2-6: {city: "", q: "mg=sipky", min: 2, client: w, expect: "Šipky 301: míření palcem, zakončení na nulu."}
  D2-7: {city: "", q: "mg=koulena", min: 2, client: w, expect: "Koulená: hod palcem, počítání bodů."}
  D2-8: {city: "", q: "mg=strelnice", min: 2, client: w, expect: "Střelnice: terče, čas, skóre."}
  D2-9: {city: nyc, q: "city=nyc&mg=taxi", min: 4, client: w, expect: "Taxi: zákazník, navigace, doručení, směna skončí výsledkem."}
  M1-S1: {city: nyc, q: "city=nyc", min: 3, client: w, expect: "Manhattan po 110th St, přes mosty jen po mostovce; GPS trasa z mapy vede po silnicích."}
