  L-S11: {city: prague, q: "city=prague&spot=naplavka_boats", min: 6, client: w, expect: "Z Náplavky po nábřeží na sever: Jiráskův most přejet tam i zpět (zkus i jízdu podél zábradlí) – auto zůstane na mostovce, nespadne do Vltavy, nezastaví ho strom ani dům pod mostem. Pod mostem Legií a Mánesovým mostem projet po nábřeží bez zastavení a bez vyskočení na most. Pak z Náplavky sjet z břehu do Vltavy: auto se potopí, objeví se na nejbližší silnici a strhne se odtah. Pro NYC stejně Brooklyn Bridge (?city=nyc)."}
