# How Ol1n checks the items waiting for him (Prompts/05 L-S14). `metro progress` turns the items with
# status "čeká na Ol1na" into docs/verify.md: passes of at most `pass_min` minutes on the phone,
# grouped by city, then the Flutter-only checks, then decisions. An item without an entry here is
# listed under "Bez návodu" so it is never lost.
#
# Fields: city (nyc | prague | tokyo; empty = any), q (web URL parameters after `?`), expect (what has
# to happen, Czech), min (minutes), client (w = web on the phone, f = Flutter app only,
# decide = a decision or a measurement, not a walk-through).
pass_min: 30
base: https://lioilsources.github.io/GTT/
checks:
  M0-S4: {city: nyc, q: "city=nyc&debug", min: 3, client: w, expect: "Nahoře ulice · čtvrť, rychlost a FPS; ⚙ otevře ladicí panel a změna hodnoty se projeví hned."}
  M0-A1: {city: nyc, q: "city=nyc&bench", min: 5, client: decide, expect: "Benchmark na Pixelu 8a a iPhonu 12 mini; fps_avg ≥ 60 na Times Square a 42nd St, výsledek zkopírovat do plans/BAKEOFF_REPORT.md."}
  M0-A3: {city: nyc, min: 15, client: decide, expect: "Slepý test památek na 3 lidech podle docs/m0-test.md."}
  M0-A4: {city: "", min: 5, client: decide, expect: "Po týdnu jízdy vybrat schéma ovládání A/B/C a potvrdit tuning.yaml (ladicí panel → Kopírovat)."}
  M0-A5: {city: "", min: 2, client: decide, expect: "Rozhodnout R3 / bránu G1 podle čísel z M0-A1 a D1-2."}
  D1-1: {city: nyc, q: "city=nyc", min: 3, client: w, expect: "Hračka M0 na telefonu: jízda po Midtownu bez sekání, mosty a tunely drží vrstvu."}
  D1-2: {city: nyc, q: "city=nyc&bench", min: 5, client: decide, expect: "Benchmark W i F na obou telefonech (fps, start, paměť); baterii ručně 10 minut."}
  D1-3: {city: "", min: 5, client: decide, expect: "Doplnit čísla z D1-2 do plans/BAKEOFF_REPORT.md a potvrdit závěr."}
  D2-1: {city: "", q: "gallery", min: 2, client: w, expect: "Galerie ukáže všechny minihry, výběr soupeře a úrovně, každá se spustí a jde zavřít."}
  D2-2: {city: "", q: "mg=sirky", min: 2, client: w, expect: "Sirky: jedna partie do konce, výsledková obrazovka."}
  D2-3: {city: "", q: "mg=oko", min: 2, client: w, expect: "Oko bere: jedna partie do konce."}
  D2-4: {city: "", q: "mg=dama", min: 3, client: w, expect: "Dáma: povinné braní funguje, partie do konce."}
