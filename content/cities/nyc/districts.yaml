  anchor_street: 42
  bearing_deg: 29                          # compass bearing of the avenues going uptown
  street_m: 80.4
  avenues_m: {river_w: -2600, 12th: -1960, 11th: -1680, 10th: -1400, 9th: -1120, 8th: -840,
              7th: -560, 6th: -280, 5th: 0, madison: 128, park: 256, lex: 384, 3rd: 512,
              2nd: 712, 1st: 912, river_e: 2200}
