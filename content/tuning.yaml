  trees_per_ha: {wood: 80, parkland: 35, garden: 40, cemetery: 25}
  trees_per_chunk_max: 600
  wood: {canopy_height_m: 14.0}   # lod ring only; the forest itself is single trees (FLOW F1)
  shore_band_m: 6.0
  trunk_radius_m: 0.8
  grip: {asphalt: 1.0, dirt: 0.8, grass: 0.75, sand: 0.6}
  crown_fade: {radius_m: 14.0, alpha: 0.35}
  water_fall: {sink_s: 1.2}
  # citypack `nature` step (plan ch. 4); clients do not read these.
  pipeline:
    simplify_m: 2.0             # outline simplification (river widths kept)
    small_water_m2: 400.0       # below: class small
    stream_river_m: 6.0         # a stream polygon wider than this is a river
    water_name_search_m: 1000.0 # unnamed river/sea pieces take the nearest named water line
    label_water_ha: 2.0
    label_green_ha: 1.0
    named_water_ha: 5.0         # validate: bigger water bodies must have a name
    area_name_water_m: 150.0    # spots.area_name: near named water
    area_name_park_m: 25.0      # spots.area_name: in or next to a named park
    big_park_ha: 5.0            # parks without inner surfaces are split by land_cover
    wood_cover_ha: 0.5
    tree_size_mix: [0.2, 0.5, 0.3]   # S, M, L for scattered trees
    street_tree_snap_m: 15.0    # inventory and OSM trees this close to a street go to its sidewalk
    tree_min_spacing_m: 3.0
    tree_row_step_m: 8.0
    deck_tree_margin_m: 2.0     # no crown within this of a bridge, ramp or viaduct footprint (on the ground below)

# Smooth driving: soft trees, wall slide, rescue (specs/flow.md, Prompts/04-METROPOLE_FLOW_PLAN.md).
flow:
  forest: {grip: 0.7, speed_factor: 0.6, crown_fade_radius_m: 22.0}
  tree_hit:
    speed_keep: 0.75            # medium and large tree
    sapling_speed_keep: 0.9     # size S
    min_speed_mps: 4.0          # a hit never drops the speed below this (if it was above)
    push_mps: 8.0               # sideways push away from the trunk
    yaw_kick_deg: 6.0
    cooldown_s: 0.5
  wall:
    slide_angle_deg: 45.0       # below: slide along the wall, above: bounce
    slide_speed_keep: 0.85
    restitution: 0.15
    friction: 0.05
  rescue:
    stuck_speed_mps: 1.0
    stuck_time_s: 1.5
    rewind_m: [8.0, 20.0]       # first and second attempt; the third moves to the road
    button_after_s: 3.0
  gap_close_m: 7.0              # citypack: building gaps and alleys narrower than this
  stuck_limit_per_10min: 1      # acceptance P3
