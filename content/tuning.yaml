# The single source of game numbers (METROPOLE_PLAN 5.1). Clients and tools read it, nothing
# else may hard-code these values. Tuned during M0 dogfooding; edit live in the debug panel.
# Units: metres, seconds, m/s, m/s², radians unless the key says otherwise.
# Types: an integer literal (25) generates an int field, a decimal (25.0) a double; write
# tunable real numbers with a decimal point. `metro gen` derives Dart/TS types from this file.

car_scale: 2.5
lane_width_m: 8.0
sidewalk_width_m: 5.0
view_width_m: {slow: 50.0, fast: 85.0}     # zoom by speed
car_anchor: {x: 0.5, y: 0.72}          # car position on screen
extrusion: {k: 0.004, knee_m: 50.0, exp: 0.85, max_scale: 2.2}
chunk_m: 256
speed_mps: {cruise: 25.0, top_default: 40.0}

# citypack: road corridors and building masses.
roads:
  lanes_by_class: {motorway: 4, trunk: 4, primary: 4, secondary: 3, tertiary: 2, residential: 1, service: 1}
  link_lanes: 1                 # ramps and slip roads
  min_kept_lanes: 2
  oneway_lane_reduction: 1      # one-way roads lose this many lanes (not below min_kept_lanes)
  alley_width_lanes: 1.5        # alley corridor width in lanes, no sidewalk
buildings:
  simplify_m: 1.5
  merge_gap_m: 0.5
  height_bands_m: [12.0, 25.0, 50.0, 100.0, 200.0]   # merge only within the same band
  min_area_m2: 12.0
  floor_height_m: 3.2
  landmark_search_m: 40.0
  degenerate_m2: 4.0              # clipped leftovers smaller than this are dropped before matching
ground:
  simplify_m: 1.0
  min_area_m2: 4.0

# Chunk streaming (METROPOLE_PLAN 6.4): window in chunks around the player.
streaming: {ahead: 3, behind: 1, side: 1, keep: 3, max_in_flight: 2, retry_s: 2.0}

camera:
  heading_follow_rate: 5.5      # 1/s, exponential smoothing of the map rotation
  zoom_follow_rate: 1.8         # 1/s

# Tyre model and car handling (METROPOLE_PLAN 7.2). Per-car values live in content/cars/.
drive:
  step_hz: 60
  substeps: 4                   # Box2D v3 sub-steps per step (client F)
  velocity_iterations: 8        # planck.js solver iterations per step (client W, DUALSTACK 6.4)
  position_iterations: 3
  axle_offset: 0.62             # axle distance from the centre, fraction of half length
  steer_lock_rad: 0.62          # wheel lock at standstill
  steer_lock_drop_rad: 0.42     # lock lost at top speed
  countersteer_gain: 0.55
  countersteer_min_slip_rad: 0.12
  countersteer_min_mps: 4.0
  countersteer_max_input: 0.9   # assist only while the player is not at full lock
  brake_min_mps: 1.0            # below this, brake means reverse
  reverse_max_mps: 9.0
  reverse_power: 0.6            # fraction of car power
  engine_brake_mps2: 2.0
  overspeed_mps: 1.0            # engine braking starts this far above the wanted speed
  drag_linear: 0.04             # 1/s
  drag_quadratic: 0.0012        # 1/m
  handbrake_decel_mps2: 3.5
  handbrake_yaw: 2.6            # rad/s² at the reference speed
  handbrake_yaw_ref_mps: 20.0
  handbrake_yaw_max: 1.5        # cap of the speed factor
  handbrake_min_mps: 5.0
  angular_damping: 1.2
  stop_spin_damping: 0.8        # angular velocity kept per step when stopped and idle
  stop_speed_mps: 0.5
  body_round_m: 0.4
  car_friction: 0.25
  car_restitution: 0.15
  building_friction: 0.2
  building_restitution: 0.12

# Bridges and tunnels: layer tracking and rails.
layers:
  search_m: 30.0
  switch_margin_m: 2.0            # an edge counts while within half width + this
  rail_margin: 0.6              # fraction of the car half width kept inside the deck edge
  rail_bounce: 1.25             # outward velocity removed (1 = stop, >1 = bounce back)
  spawn_search_m: 200.0
  deck_lift_m: 6.0              # bridge deck height per layer in the 3D client W (DUALSTACK 6.2)

controls:
  a_full_steer_width: 0.22      # thumb travel for full lock, fraction of screen width
  a_dead_zone_height: 0.06      # vertical travel before brake/boost, fraction of screen height
  a_full_brake_height: 0.08     # extra travel to full brake
  c_max_wheel_rad: 1.885

# Street furniture (procedural per chunk, never stored).
props:
  spacing_m: 20.0
  spacing_jitter_m: 10.0
  skip_chance: 0.35
  first_m: 14.0
  clear_intersection_m: 16.0
  mix: {lamp: 0.38, hydrant: 0.17, bin: 0.25, newsbox: 0.10, planter: 0.10}
  radius_m: {lamp: 0.25, hydrant: 0.25, bin: 0.35, newsbox: 0.4, planter: 0.6}   # before car_scale
  knock_min_mps: 1.5
  knock_slowdown: 0.94          # car speed kept after knocking a prop
  knock_carry: 0.9              # fraction of car velocity given to the prop
  knock_side: 0.3               # sideways kick, fraction of car speed
  knock_spin: 4.0                 # rad/s, plus knock_spin_per_mps × speed
  knock_spin_per_mps: 0.2
  fly_s: 2.5
  fly_damping: 0.08             # velocity kept after 1 s of sliding
  respawn_s: 25.0

skids:
  min_slip_mps: 2.5
  brake_min_mps: 12.0
  max_segments: 600

# D1 measurement autopilot (specs/bench.md); route in content/bench/<city>.json.
bench:
  lookahead_m: 12.0             # pure pursuit target distance ahead on the route
  lookahead_per_mps: 0.5        # plus this × speed
  steer_gain: 2.5               # steer per radian of heading error
  corner_lookahead_m: 40.0      # route ahead checked for turns
  corner_turn_rad: 0.6          # a turn sharper than this within the lookahead slows the car
  corner_speed_mps: 10.0
  brake_per_mps: 0.25           # brake per m/s above the wanted speed
  stuck_s: 3.0                  # slower than stuck_mps for this long = put back on the route
  stuck_mps: 1.0
  respawn_ahead_m: 15.0
  arrive_m: 10.0
  warmup_s: 3.0                 # frames before this are left out of the fps numbers
  search_back_m: 10.0           # route progress is searched in [s − back, s + ahead]
  search_ahead_m: 60.0

hud:
  street_labels_below_mps: 9.0
  street_label_radius_m: 70.0
  street_labels_max: 4
  border_notice_m: 80.0

# Minigames (METROPOLE_PLAN 9, specs/minigames/). Rules read these through the generated Tuning.
minigames:
  time_cap_s: 600               # hard cap for every minigame (9.2)
  sirky:
    start: 15
    min_start: 12
    max_start: 25
    max_take: 3
    rounds_to_win: 5
    ai_error_pct: [60, 45, 30, 15, 0]   # per AI level 1..5
    time_cap_s: 300
    ai_think_s: 0.7             # pause before the opponent's move (UI only)
  oko:
    rounds_to_win: 5
    dealer_stand: 17
    time_cap_s: 420
    dealer_draw_s: 0.6          # pause between the banker's cards (UI only)
  dama:
    ai_depth: [1, 2, 3, 4, 5]   # minimax plies per AI level 1..5
    ai_error_pct: [35, 20, 10, 5, 0]
    quiet_limit: 50             # plies without a capture or a man move = draw
    fast_plies: 80              # a win within this many plies = 3 stars
    time_cap_s: 480
    ai_think_s: 0.6
  desetitisic:
    target: 5000
    max_rounds: 10
    ai_bank_at: [250, 300, 350, 400, 450]
    ai_error_pct: [40, 25, 10, 5, 0]
    star_margins: [1500, 500]   # lead for 3 and 2 stars
    time_cap_s: 420
    ai_think_s: 0.8
  sipky:
    start: 301
    max_rounds: 15
    player_scatter: 60          # 0.1 mm
    ai_scatter: [420, 300, 210, 150, 100]
    star_darts: [18, 27]
    player_wobble: 120          # crosshair sway amplitude, 0.1 mm (UI only)
    wobble_hz: 0.9
    time_cap_s: 360
    ai_think_s: 0.7
  koulena:
    series: 3
    balls: 9
    ring_r: [80, 160, 240, 320, 400]   # mm
    ring_points: [50, 40, 30, 20, 10]
    pockets: [-300, 360, 300, 360]     # x, y pairs
    pocket_r: 50
    pocket_points: 100
    scatter: [40, 55, 70, 85, 100]     # mm per difficulty 1..5
    star_scores: [700, 520, 360]
    flick_mm_per_px: 2.2               # swipe length to aim distance (UI only)
    time_cap_s: 360
  strelnice:
    tick_hz: 30
    rounds: 3
    round_ticks: 2700
    targets: 36
    width: 1000
    lanes: [250, 500, 750]
    kinds: [40, 9, 50, 60, 6, 20, 80, 4, 10]   # (radius, speed per tick, points) small, medium, large
    kind_pct: [15, 55]
    magazine: 6
    reload_ticks: 45
    star_scores: [1500, 1000, 600]
    time_cap_s: 360

# GPS route (specs/route.md). class_cost: per RoadClass index (unknown, motorway, trunk, primary,
# secondary, tertiary, residential, service); integer multipliers of the length in dm.
route:
  class_cost: [12, 8, 8, 9, 10, 10, 12, 14]
  reroute_m: 30.0
  reroute_s: 2.0
  arrive_m: 18.0
  line_width_m: 3.0

# Pedestrians (specs/pedestrians.md). They always dodge (R7) and are never physics bodies.
# class_density: spawn acceptance per RoadClass index (unknown, motorway, trunk, primary,
# secondary, tertiary, residential, service).
pedestrians:
  enabled: true
  seed: 7919
  max_count: 40
  night_factor: 0.4            # density and max_count at night
  radius_m: 0.3                # body radius before car_scale
  walk_mps: 1.4
  walk_jitter_mps: 0.4
  class_density: [0.2, 0.0, 0.3, 1.0, 0.9, 0.75, 0.55, 0.3]
  busy_districts: ["Midtown", "Theater District", "Financial District", "SoHo", "Chinatown", "Greenwich Village", "Garment District", "Flatiron"]
  busy_factor: 1.0
  quiet_factor: 0.6
  spawn_margin_m: 15.0         # the spawn ring starts this far beyond the visible radius
  spawn_band_m: 60.0
  despawn_margin_m: 100.0      # farther than visible radius + this from the car = removed
  spawn_per_s: 15.0            # spawn attempts per second
  fill_attempts: 300           # attempts when the area is filled at once (start, teleport)
  fill_clear_m: 25.0
  snap_m: 30.0                 # max distance from a sample point to a sidewalk
  cross_chance: 0.35           # at a node: switch to the other side of the street
  dodge_horizon_s: 1.2
  dodge_min_mps: 0.5
  dodge_margin_m: 0.6
  dodge_extra_m: 1.2
  leap_s: 0.25
  leap_fraction: 0.5           # a leap takes at most this part of the time to contact (<= 0.5)
  stun_s: 0.7
  bubble_s: 1.3
  bubble_px: 13.0
  bubble_lift_px: 20.0

# In-game phone (specs/phone.md): opening gesture, slowed driving, feed gestures, map.
phone:
  time_scale: 0.35          # driving runs this much slower while the phone is open
  height_pct: 88            # phone height, % of the screen
  edge_px: 28.0             # bottom-edge grab zone
  pull_px: 48.0             # swipe up this far to open
  swipe_px: 60.0            # feed card swipe threshold
  double_tap_ms: 300
  map_padding_px: 14.0
  map_spot_px: 5.0
  map_player_px: 7.0
  map_route_px: 3.0

# Feed deck selection (specs/feed.md, P0, integers only).
feed:
  deck_size: 6
  novelty: 30
  pref_step: 10
  pref_min: -3
  pref_max: 3
  drive_dm_per_s: 110       # average city speed for the drive time (11 m/s)
  straight_pct: 140         # unreachable: straight line × this / 100
  band_min_s: 60            # the 1–3 min drive band
  band_max_s: 180
  band_points: 40
  near_points: 15
  band_falloff_s: 120
  district_bonus: 20
  landmark_bonus: 15
  landmark_radius_dm: 2500
  jitter: 12
  host_lines: 6
  reward_base: 50
  reward_per_min: 20
  difficulty_base: 2
  difficulty_max: 5
  redeal_m: 300.0           # a new deck after driving this far since the last one (or arriving)

# GPS navigation UI (specs/phone.md "Navigace"); route search numbers are in `route`.
nav:
  search_m: 60.0            # nearest kept edge when the car is in an alley
  arrow_margin_px: 28.0
  arrow_px: 16.0
  toast_s: 2.5
  km_from_m: 1000.0
  round_m: 10
  mi_from: 0.1
  round_ft: 50
# Traffic and traffic lights (specs/traffic.md). Per-class lists are indexed by RoadClass
# (unknown, motorway, trunk, primary, secondary, tertiary, residential, service).
traffic:
  enabled: true
  max_cars: 30                  # dynamic bodies for traffic in total (METROPOLE_PLAN 7.3)
  night_factor: 0.5             # fraction of max_cars at night
  class_weight: [0.0, 1.0, 1.0, 1.0, 0.85, 0.6, 0.35, 0.1]   # spawn acceptance per class
  class_speed_mps: [8.0, 22.0, 17.0, 14.0, 13.0, 11.0, 9.0, 6.0]
  car_length_m: 4.6             # before car_scale
  car_width_m: 1.9
  spawn_min_m: 150.0            # spawn ring around the player, outside the view
  spawn_max_m: 250.0
  despawn_m: 280.0
  initial_min_m: 30.0           # inner radius of the first fill (start, respawn)
  teleport_m: 60.0              # a player jump longer than this refills like a start
  spawn_interval_s: 0.25
  spawn_tries: 4
  initial_tries: 400
  spawn_clear_m: 20.0
  search_m: 40.0
  seed: 20251
  accel_mps2: 2.5
  brake_mps2: 7.0
  min_gap_m: 2.5
  headway_s: 1.1
  look_ahead_m: 45.0
  corridor: 1.15                # lateral reach for the car ahead, × sum of half widths
  follow_rate: 7.0              # 1/s, smoothing of position and heading towards the lane
  hit_stop_s: 2.5
  hit_min_mps: 1.5
  hit_margin_m: 0.3
  amber_commit_m: 14.0          # on amber, cars closer than this to the stop line go on
  stop_margin_m: 1.5
  signal_classes: [2, 3, 4]     # trunk, primary, secondary
  signal_min_main: 2
  signal_min_edges: 3
  signal_seed: 7919
  green_ms: 14000
  amber_ms: 3000
  all_red_ms: 1500
  light_side_m: 1.2             # indicator outside the carriageway edge
  light_radius_m: 1.1
  light_draw_max: 160
