# The single source of game numbers (METROPOLE_PLAN 5.1). Clients and tools read it, nothing
# else may hard-code these values. Tuned during M0 dogfooding; edit live in the debug panel.
# Units: metres, seconds, m/s, m/s², radians unless the key says otherwise.
# Types: an integer literal (25) generates an int field, a decimal (25.0) a double; write
# tunable real numbers with a decimal point. `metro gen` derives Dart/TS types from this file.

car_scale: 2.5
lane_width_m: 8.0
sidewalk_width_m: 5.0
view_width_m: {slow: 50.0, fast: 85.0}     # zoom by speed
car_anchor: {x: 0.5, y: 0.72}          # car position on screen
extrusion: {k: 0.004, knee_m: 50.0, exp: 0.85, max_scale: 2.2}
chunk_m: 256
speed_mps: {cruise: 25.0, top_default: 40.0}

# citypack: road corridors and building masses.
roads:
  lanes_by_class: {motorway: 4, trunk: 4, primary: 4, secondary: 3, tertiary: 2, residential: 1, service: 1}
  link_lanes: 1                 # ramps and slip roads
  min_kept_lanes: 2
  oneway_lane_reduction: 1      # one-way roads lose this many lanes (not below min_kept_lanes)
  alley_width_lanes: 1.5        # alley corridor width in lanes, no sidewalk
buildings:
  simplify_m: 1.5
  merge_gap_m: 0.5
  height_bands_m: [12.0, 25.0, 50.0, 100.0, 200.0]   # merge only within the same band
  min_area_m2: 12.0
  floor_height_m: 3.2
  landmark_search_m: 40.0
  degenerate_m2: 4.0              # clipped leftovers smaller than this are dropped before matching
ground:
  simplify_m: 1.0
  min_area_m2: 4.0
# Pedestrian zones and bollards (specs/zones.md): citypack uses the first three, clients the rest.
zones:
  street_width_m: 12.0          # corridor around a pedestrian street segment
  gap_margin_m: 1.5             # clearance kept around every road corridor (roads stay drivable)
  min_barrier_m: 2.0            # shorter bollard pieces are dropped
  bollard_spacing_m: 4.0
  bollard_radius_m: 0.6
  bollard_height_m: 2.0

# Hop over traffic with an air tank (specs/hop.md); charges per car live in content/cars/<id>.json.
hop:
  air_s: 1.4
  height_m: 7.0                 # top of the arc (drawing only)
  min_speed_mps: 8.0
  flips: 1

# Trams (specs/trams.md): citypack uses min_track_m and the stop_* pair, clients the rest.
trams:
  enabled: true
  min_track_m: 120.0            # dead-end spurs shorter than this are dropped (depots, sidings)
  stop_spacing_m: 450.0
  stop_min_chain_m: 300.0       # only track runs between switches longer than this get stops
  stop_commit_m: 4.0            # a stop closer than this ahead is skipped (already passing)
  max_trams: 6
  speed_mps: 12.0
  accel_mps2: 1.2
  brake_mps2: 2.5
  min_gap_m: 4.0
  look_ahead_m: 60.0
  corridor_m: 4.0               # lateral half-width of the track corridor for obstacles
  dwell_s: 6.0
  cars_per_tram: 3
  car_length_m: 14.0            # world metres (already scaled, no car_scale)
  car_width_m: 5.5
  joint_gap_m: 0.6
  trail_points: 64
  hit_min_mps: 3.0
  hit_stop_s: 4.0
  spawn_interval_s: 1.5
  spawn_tries: 4
  spawn_min_m: 220.0
  spawn_max_m: 420.0
  initial_min_m: 60.0
  spawn_clear_m: 50.0
  despawn_m: 520.0
  seed: 20261122
  rail_gauge_m: 3.6             # drawn distance between the two rails (world metres)

# Chunk streaming (METROPOLE_PLAN 6.4): window in chunks around the player.
streaming: {ahead: 3, behind: 1, side: 1, keep: 3, max_in_flight: 2, retry_s: 2.0}

camera:
  heading_follow_rate: 5.5      # 1/s, exponential smoothing of the map rotation
  zoom_follow_rate: 1.8         # 1/s

# Tyre model and car handling (METROPOLE_PLAN 7.2). Per-car values live in content/cars/.
drive:
  step_hz: 60
  substeps: 4                   # Box2D v3 sub-steps per step (client F)
  velocity_iterations: 8        # planck.js solver iterations per step (client W, DUALSTACK 6.4)
  position_iterations: 3
  axle_offset: 0.62             # axle distance from the centre, fraction of half length
  steer_lock_rad: 0.62          # wheel lock at standstill
  steer_lock_drop_rad: 0.42     # lock lost at top speed
  countersteer_gain: 0.55
  countersteer_min_slip_rad: 0.12
  countersteer_min_mps: 4.0
  countersteer_max_input: 0.9   # assist only while the player is not at full lock
  brake_min_mps: 1.0            # below this, brake means reverse
  reverse_max_mps: 9.0
  reverse_power: 0.6            # fraction of car power
  engine_brake_mps2: 2.0
  overspeed_mps: 1.0            # engine braking starts this far above the wanted speed
  drag_linear: 0.04             # 1/s
  drag_quadratic: 0.0012        # 1/m
  handbrake_decel_mps2: 3.5
  handbrake_yaw: 2.6            # rad/s² at the reference speed
  handbrake_yaw_ref_mps: 20.0
  handbrake_yaw_max: 1.5        # cap of the speed factor
  handbrake_min_mps: 5.0
  angular_damping: 1.2
  stop_spin_damping: 0.8        # angular velocity kept per step when stopped and idle
  stop_speed_mps: 0.5
  body_round_m: 0.4
  car_friction: 0.25
  car_restitution: 0.15
  building_friction: 0.2
  building_restitution: 0.12

# Bridges and tunnels: layer tracking and rails.
layers:
  search_m: 30.0
  switch_margin_m: 2.0            # an edge counts while within half width + this
  rail_margin: 0.6              # fraction of the car half width kept inside the deck edge
  rail_bounce: 1.25             # outward velocity removed (1 = stop, >1 = bounce back)
  spawn_search_m: 200.0
  deck_lift_m: 6.0              # bridge deck height per layer in the 3D client W (DUALSTACK 6.2)

controls:
  a_full_steer_width: 0.22      # thumb travel for full lock, fraction of screen width
  a_dead_zone_height: 0.06      # vertical travel before brake/boost, fraction of screen height
  a_full_brake_height: 0.08     # extra travel to full brake
  c_max_wheel_rad: 1.885

# Street furniture (procedural per chunk, never stored).
props:
  spacing_m: 20.0
  spacing_jitter_m: 10.0
  skip_chance: 0.35
  first_m: 14.0
  clear_intersection_m: 16.0
  mix: {lamp: 0.38, hydrant: 0.17, bin: 0.25, newsbox: 0.10, planter: 0.10}
  radius_m: {lamp: 0.25, hydrant: 0.25, bin: 0.35, newsbox: 0.4, planter: 0.6}   # before car_scale
  knock_min_mps: 1.5
  knock_slowdown: 0.94          # car speed kept after knocking a prop
  knock_carry: 0.9              # fraction of car velocity given to the prop
  knock_side: 0.3               # sideways kick, fraction of car speed
  knock_spin: 4.0                 # rad/s, plus knock_spin_per_mps × speed
  knock_spin_per_mps: 0.2
  fly_s: 2.5
  fly_damping: 0.08             # velocity kept after 1 s of sliding
  respawn_s: 25.0

skids:
  min_slip_mps: 2.5
  brake_min_mps: 12.0
  max_segments: 600

# D1 measurement autopilot (specs/bench.md); route in content/bench/<city>.json.
bench:
  lookahead_m: 12.0             # pure pursuit target distance ahead on the route
  lookahead_per_mps: 0.5        # plus this × speed
  steer_gain: 2.5               # steer per radian of heading error
  corner_lookahead_m: 40.0      # route ahead checked for turns
  corner_turn_rad: 0.6          # a turn sharper than this within the lookahead slows the car
  corner_speed_mps: 10.0
  brake_per_mps: 0.25           # brake per m/s above the wanted speed
  stuck_s: 3.0                  # slower than stuck_mps for this long = put back on the route
  stuck_mps: 1.0
  respawn_ahead_m: 15.0
  arrive_m: 10.0
  warmup_s: 3.0                 # frames before this are left out of the fps numbers
  search_back_m: 10.0           # route progress is searched in [s − back, s + ahead]
  search_ahead_m: 60.0

hud:
  street_labels_below_mps: 9.0
  street_label_radius_m: 70.0
  street_labels_max: 4
  border_notice_m: 80.0

# Minigames (METROPOLE_PLAN 9, specs/minigames/). Rules read these through the generated Tuning.
minigames:
  time_cap_s: 600               # hard cap for every minigame (9.2)
  sirky:
    start: 15
    min_start: 12
    max_start: 25
    max_take: 3
    rounds_to_win: 5
    ai_error_pct: [60, 45, 30, 15, 0]   # per AI level 1..5
    time_cap_s: 300
    ai_think_s: 0.7             # pause before the opponent's move (UI only)
  oko:
    rounds_to_win: 5
    dealer_stand: 17
    time_cap_s: 420
    dealer_draw_s: 0.6          # pause between the banker's cards (UI only)
  dama:
    ai_depth: [1, 2, 3, 4, 5]   # minimax plies per AI level 1..5
    ai_error_pct: [35, 20, 10, 5, 0]
    quiet_limit: 50             # plies without a capture or a man move = draw
    fast_plies: 80              # a win within this many plies = 3 stars
    time_cap_s: 480
    ai_think_s: 0.6
  desetitisic:
    target: 5000
    max_rounds: 10
    ai_bank_at: [250, 300, 350, 400, 450]
    ai_error_pct: [40, 25, 10, 5, 0]
    star_margins: [1500, 500]   # lead for 3 and 2 stars
    time_cap_s: 420
    ai_think_s: 0.8
  sipky:
    start: 301
    max_rounds: 15
    player_scatter: 60          # 0.1 mm
    ai_scatter: [420, 300, 210, 150, 100]
    star_darts: [18, 27]
    player_wobble: 120          # crosshair sway amplitude, 0.1 mm (UI only)
    wobble_hz: 0.9
    time_cap_s: 360
    ai_think_s: 0.7
  koulena:
    series: 3
    balls: 9
    ring_r: [80, 160, 240, 320, 400]   # mm
    ring_points: [50, 40, 30, 20, 10]
    pockets: [-300, 360, 300, 360]     # x, y pairs
    pocket_r: 50
    pocket_points: 100
    scatter: [40, 55, 70, 85, 100]     # mm per difficulty 1..5
    star_scores: [700, 520, 360]
    flick_mm_per_px: 2.2               # swipe length to aim distance (UI only)
    time_cap_s: 360
  kulicky:
    rounds: 5
    hole_r: 25                         # mm
    hole_points: 3
    closer_points: 1
    scatter: [30, 40, 50, 60, 70]      # mm per difficulty 1..5 (player)
    ai_scatter: [110, 90, 70, 55, 40]
    star_margins: [6, 3, 1]
    flick_mm_per_px: 1.6               # swipe length to aim distance (UI only)
    time_cap_s: 300
  cara:
    rounds: 7
    line_points: 3
    round_points: 1
    scatter: [20, 28, 36, 44, 52]
    ai_scatter: [90, 70, 55, 40, 28]
    ai_aim: [90, 70, 55, 40, 28]       # mm short of the line
    star_margins: [5, 3, 1]
    flick_mm_per_px: 1.4
    time_cap_s: 240
  nohejbal:
    half_width: 450                    # mm
    depth: 900
    win_points: 10
    win_by: 2
    max_points: 15
    scatter: [40, 55, 70, 85, 100]
    ai_scatter: [160, 130, 100, 80, 60]
    ai_reach: [380, 420, 460, 500, 540]
    player_reach: 380                  # mm, the player returns balls within this
    ai_margin: [220, 180, 140, 110, 80]
    star_margins: [6, 3, 1]
    flick_mm_per_px: 2.0
    time_cap_s: 360
  strelnice:
    tick_hz: 30
    rounds: 3
    round_ticks: 2700
    targets: 36
    width: 1000
    lanes: [250, 500, 750]
    kinds: [40, 9, 50, 60, 6, 20, 80, 4, 10]   # (radius, speed per tick, points) small, medium, large
    kind_pct: [15, 55]
    magazine: 6
    reload_ticks: 45
    star_scores: [1500, 1000, 600]
    time_cap_s: 360
  # Taxi shift (specs/minigames/taxi.md): a world minigame in the taxi_metro car.
  taxi:
    shift_s: 240
    fare_base: 6
    fare_per_km: 20
    expect_base_s: 15           # expected ride = base + route dm / expect_dm_per_s
    expect_dm_per_s: 70
    bonus_per_s: 1              # per second faster than expected, capped at bonus_max_pct of the meter
    bonus_max_pct: 30
    late_per_s: 1               # per second slower, capped at late_max_pct of the meter
    late_max_pct: 50
    tip_pct: 20                 # tip in % of the meter, minus hit_tip_pct per crash into traffic
    hit_tip_pct: 5
    star_fares: [180, 110, 45]  # shift fare for 3, 2, 1 stars
    lines: 6                    # passenger lines taxiLine1..N in i18n
    pickup_min_m: 50.0
    pickup_max_m: 180.0
    pickup_radius_m: 10.0
    drop_radius_m: 20.0
    stop_speed_mps: 1.5
    dest_min_m: 400.0
    dest_max_m: 1800.0
    dest_search_m: 120.0
    renav_s: 3.0
    line_s: 4.0
    low_s: 30.0                 # the shift timer turns red below this (UI only)
    passenger_m: 2.0            # passenger marker radius (min passenger_px)
    passenger_px: 6.0
    curb_m: 1.0                 # passenger beyond the corridor edge

# GPS route (specs/route.md). class_cost: per RoadClass index (unknown, motorway, trunk, primary,
# secondary, tertiary, residential, service); integer multipliers of the length in dm.
route:
  class_cost: [12, 8, 8, 9, 10, 10, 12, 14]
  reroute_m: 30.0
  reroute_s: 2.0
  arrive_m: 18.0
  line_width_m: 3.0

# Pedestrians (specs/pedestrians.md). They always dodge (R7) and are never physics bodies.
# class_density: spawn acceptance per RoadClass index (unknown, motorway, trunk, primary,
# secondary, tertiary, residential, service).
pedestrians:
  enabled: true
  seed: 7919
  max_count: 40
  night_factor: 0.4            # density and max_count at night
  radius_m: 0.3                # body radius before car_scale
  walk_mps: 1.4
  walk_jitter_mps: 0.4
  class_density: [0.2, 0.0, 0.3, 1.0, 0.9, 0.75, 0.55, 0.3]
  busy_districts: ["Midtown", "Theater District", "Financial District", "SoHo", "Chinatown", "Greenwich Village", "Garment District", "Flatiron"]
  busy_factor: 1.0
  quiet_factor: 0.6
  spawn_margin_m: 15.0         # the spawn ring starts this far beyond the visible radius
  spawn_band_m: 60.0
  despawn_margin_m: 100.0      # farther than visible radius + this from the car = removed
  spawn_per_s: 15.0            # spawn attempts per second
  fill_attempts: 300           # attempts when the area is filled at once (start, teleport)
  fill_clear_m: 25.0
  snap_m: 30.0                 # max distance from a sample point to a sidewalk
  cross_chance: 0.35           # at a node: switch to the other side of the street
  dodge_horizon_s: 1.2
  dodge_min_mps: 0.5
  dodge_margin_m: 0.6
  dodge_extra_m: 1.2
  leap_s: 0.25
  leap_fraction: 0.5           # a leap takes at most this part of the time to contact (<= 0.5)
  stun_s: 0.7
  bubble_s: 1.3
  bubble_px: 13.0
  bubble_lift_px: 20.0

# In-game phone (specs/phone.md): opening gesture, slowed driving, feed gestures, map.
phone:
  time_scale: 0.35          # unused since specs/phone.md v3 (the phone pauses the game, specs/pause.md)
  height_pct: 88            # phone height, % of the screen
  edge_px: 28.0             # bottom-edge grab zone
  pull_px: 48.0             # swipe up this far to open
  swipe_px: 60.0            # feed card swipe threshold
  double_tap_ms: 300
  map_padding_px: 14.0
  map_spot_px: 5.0
  map_player_px: 7.0
  map_route_px: 3.0

# Feed deck selection (specs/feed.md, P0, integers only).
feed:
  deck_size: 6
  novelty: 30
  pref_step: 10
  pref_min: -3
  pref_max: 3
  drive_dm_per_s: 110       # average city speed for the drive time (11 m/s)
  straight_pct: 140         # unreachable: straight line × this / 100
  band_min_s: 60            # the 1–3 min drive band
  band_max_s: 180
  band_points: 40
  near_points: 15
  band_falloff_s: 120
  district_bonus: 20
  landmark_bonus: 15
  landmark_radius_dm: 2500
  jitter: 12
  host_lines: 6
  reward_base: 50
  reward_per_min: 20
  difficulty_base: 2
  difficulty_max: 5
  redeal_m: 300.0           # a new deck after driving this far since the last one (or arriving)

# GPS navigation UI (specs/phone.md "Navigace"); route search numbers are in `route`.
nav:
  search_m: 60.0            # nearest kept edge when the car is in an alley
  arrow_margin_px: 28.0
  arrow_px: 16.0
  toast_s: 2.5
  km_from_m: 1000.0
  round_m: 10
  mi_from: 0.1
  round_ft: 50
# Traffic and traffic lights (specs/traffic.md). Per-class lists are indexed by RoadClass
# (unknown, motorway, trunk, primary, secondary, tertiary, residential, service).
traffic:
  enabled: true
  max_cars: 30                  # dynamic bodies for traffic in total (METROPOLE_PLAN 7.3)
  night_factor: 0.5             # fraction of max_cars at night
  class_weight: [0.0, 1.0, 1.0, 1.0, 0.85, 0.6, 0.35, 0.1]   # spawn acceptance per class
  class_speed_mps: [8.0, 22.0, 17.0, 14.0, 13.0, 11.0, 9.0, 6.0]
  car_length_m: 4.6             # before car_scale
  car_width_m: 1.9
  spawn_min_m: 150.0            # spawn ring around the player, outside the view
  spawn_max_m: 250.0
  despawn_m: 280.0
  initial_min_m: 30.0           # inner radius of the first fill (start, respawn)
  teleport_m: 60.0              # a player jump longer than this refills like a start
  spawn_interval_s: 0.25
  spawn_tries: 4
  initial_tries: 400
  spawn_clear_m: 20.0
  search_m: 40.0
  seed: 20251
  accel_mps2: 2.5
  brake_mps2: 7.0
  min_gap_m: 2.5
  headway_s: 1.1
  look_ahead_m: 45.0
  corridor: 1.15                # lateral reach for the car ahead, × sum of half widths
  follow_rate: 7.0              # 1/s, smoothing of position and heading towards the lane
  hit_stop_s: 2.5
  hit_min_mps: 1.5
  hit_margin_m: 0.3
  mass_kg: 1400.0               # traffic car mass when it is loose (pushed, specs/traffic.md step 7)
  push_hold_s: 1.0              # stays loose this long after the last touch
  push_linear_damping: 2.5
  push_angular_damping: 3.0
  swerve_ahead_m: 22.0          # start moving round a parked car this far ahead (step 8)
  swerve_margin_m: 0.6
  swerve_max_m: 7.0             # a bigger sideways shift is not attempted
  amber_commit_m: 14.0          # on amber, cars closer than this to the stop line go on
  stop_margin_m: 1.5
  signal_classes: [2, 3, 4]     # trunk, primary, secondary
  signal_min_main: 2
  signal_min_edges: 3
  signal_seed: 7919
  green_ms: 14000
  amber_ms: 3000
  all_red_ms: 1500
  light_side_m: 1.2             # indicator outside the carriageway edge
  light_radius_m: 1.1
  light_draw_max: 160
# Tourist passport (specs/passport.md). weights: points per stamp kind (landmark, district,
# minigame, photo); percent = floor(100 × points / all points).
passport:
  weights: [3, 1, 3, 2]
  stars_for_stamp: 3
  discover_radius_m: 110.0    # car to a landmark's label anchor (Met Museum is 95 m off the road)
  postcard_s: 6.0             # postcard / stamp label stays this long (UI)
# NPC dialogue (specs/dialogue.md): skit queue, vibe meter, phone contact chance (integers, P0).
npc:
  recent_k: 4                 # last K skits that are not repeated while fresh ones exist
  vibe_max: 20
  vibe_start: 0
  contact_min_vibe: 6         # no contact roll below this vibe
  contact_base_pct: 25        # chance at contact_min_vibe
  contact_step_pct: 10        # + per vibe point above it
  contact_max_pct: 85
# Cars, switching and the garage (specs/cars.md). Distances in world metres (after car_scale).
cars:
  start_car: m0_coupe
  start_owned: [m0_coupe]
  start_cash: 0
  board_distance_m: 10.0      # centre to centre, player car to a parked car
  board_speed_mps: 1.5
  garage_radius_m: 18.0       # around the garage spot's parking point
  garage_speed_mps: 1.5
  action_hold_s: 1.5          # the context button stays this long after the stop (auto-throttle moves on)
  parked:
    salt: 739982445
    per_chunk: 4
    attempts: 24
    classes: [3, 4, 5, 6]      # RoadClass: primary, secondary, tertiary, residential
    models: [hatch_pip, muscle_brute, taxi_metro, pickup_hauler, m0_coupe, lidovka, kolobezka, kolo]   # filtered by the city's tag
    segment_margin_m: 14.0
    curb_gap_m: 0.5
    min_inner_m: 2.0
    min_spacing_m: 16.0
    clear_player_m: 20.0
    forget_m: 600.0
    mass_factor: 1.0          # parked cars are dynamic bodies the player and traffic can push
    linear_damping: 3.0
    angular_damping: 4.0
# Police and wanted level (specs/police.md). P0 rules run in integer ticks: s → round(s · tick_hz).
# Distances in world metres (after car_scale); patrols are traffic cars flagged as police.
police:
  enabled: true
  max_level: 3                # M2: wanted 1–3, roadblock at 3 (specs/roadblock.md)
  tick_hz: 10
  escape_s: 10.0              # out of sight of every patrol → level − 1
  capture_s: 3.0              # a patrol next to a slow player this long → busted
  hit_run_s: 6.0              # leaving a crash site within this window = hit-and-run
  hit_run_m: 40.0             # "left" = this far from the crash point
  cooldown_s: 4.0             # the same offence counts again only after this
  offence_level: {crash: 1, hitrun: 2, sidewalk: 1, theft: 1}
  fines: [0, 100, 250, 500]   # cash per wanted level when busted (index = level)
  patrols: [2, 3, 4, 5]       # police cars among traffic per wanted level
  pick_min_m: 160.0           # a traffic car becomes a patrol only this far from the player
  pick_interval_s: 1.0
  view_m: 70.0                # patrol line of sight radius
  pursuit_m: 320.0            # patrols closer than this chase while wanted
  pursuit_mps: [0.0, 24.0, 28.0, 32.0]
  uturn_s: 3.0
  uturn_m: 25.0
  capture_m: 24.0
  capture_mps: 3.0
  sidewalk_s: 0.5
  sidewalk_min_mps: 3.0
  sidewalk_margin_m: 1.0
  toast_s: 3.0
  busted_s: 2.5
  light_blink_s: 0.25
  roadblock:                  # two standing patrols across the road ahead (specs/roadblock.md)
    level: 3                  # wanted level that sends a roadblock
    ahead_m: 140.0            # along the road in the player's direction (past view_m)
    probe_m: 600.0            # goal for choosing the next edge: this far along the heading
    lateral_m: 3.0            # each patrol this far left and right of the edge centre
    clear_m: 260.0            # removed when the player is farther than this
    ttl_s: 40.0
    cooldown_s: 12.0
# Economy (specs/economy.md): cash for a loop result, tow fee. The drive part of the reward uses
# feed.reward_base / reward_per_min / drive_dm_per_s, so the feed card shows the 3★ trip money.
economy:
  base: 60                      # game money before engine and star percentages
  engine_pct: {cards: 100, board: 120, dice: 100, tiles: 100, flick: 100, rhythm: 100, arcade: 100, puzzle: 90, drive: 110, service: 100, sport: 100}
  star_pct: [0, 50, 80, 100]    # per stars 0..3
  score_bands: [300, 700, 1200] # ascending score thresholds
  band_bonus: [0, 10, 25, 50]   # one more than score_bands
  first_bonus: 100              # first finish of a minigame with at least first_min_stars
  first_min_stars: 1
  tow_fee: 75                   # wrecked car (paid up to the cash the player has)
# Loop glue (specs/loop.md): the "Play" context button at a spot without a route.
loop:
  spot_radius_m: 22.0           # around the spot's parking point
  stop_speed_mps: 1.5
  action_hold_s: 1.5
