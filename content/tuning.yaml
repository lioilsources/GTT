# Terrain relief (specs/terrain.md, Prompts/02-METROPOLE_TERRAIN_PLAN.md). Defaults, tuned in T3.
terrain:
  exaggeration: 2.0             # game height = z0 + (real − z0) x this (K2)
  grid_m: 8                     # terrain grid step in chunks (33 x 33 per 256 m chunk)
  blend_m: 24                   # road-to-terrain blend distance
  max_grade: {motorway: 0.08, trunk: 0.10, primary: 0.20, secondary: 0.20, tertiary: 0.28, alley: 0.33}
  bridge: {clear_water_m: 15.0, clear_road_m: 6.0, max_grade: 0.07}
  tunnel: {depth_water_m: 10.0, depth_land_m: 8.0, max_grade: 0.07}
  # citypack `elevation` and `lod` steps (plan ch. 4); clients do not read these.
  pipeline:
    dem_margin_m: 500.0         # DEM read around the area
    dem_grid_m: 4.0             # working grid in local metres
    dem_zoom: 15                # AWS Terrain Tiles zoom (~3.6 m/px at 40° N)
    clean_sigma_m: 30.0         # smoothing after removing buildings from a surface model
    clean_sigma_coarse_m: 60.0  # the same for a coarse one (~25 m EU-DEM smears blocks into streets)
    profile_step_m: 16.0        # road profile samples (and densified edges)
    profile_window_m: {lidar: 40.0, coarse: 120.0}
    elevated_m: 8.0             # viaduct over land: terrain + this
    underwater_m: 3.0           # terrain under water: level − this
    grade_tolerance_m: 0.05     # grade_clamp stops below this excess
    grade_passes: 500
    z_tolerance_m: 0.1          # densified samples on a straight profile are dropped
    road_gap_max_m: 0.3         # validate: road edge vs terrain
    road_gap_share: 0.01        # validate: share of road edge samples allowed over road_gap_max_m
    # validate: |terrain − road profile| on kept carriageways (the car rides the terrain there)
    # max_m 1.2: Moscow courtyard service ramps (Novoslobodskaya, Taganka) reach 1.18 m; Prague max 0.87, NYC 0.42
    road_strip: {tol_m: 0.15, share: 0.005, max_m: 2.1}
    # conform and validate: terrain within road width / 2 + margin_m never above the road + max_m
    trench: {margin_m: 2.0, max_m: 0.3, share: 0.005}
    # a ground edge joined to a structure and this far above the terrain this long is a bridge
    elevated_flag: {above_m: 2.0, run_m: 5.0}
    bridge_min_clear_m: 2.0     # validate fails below water/road + this; below bridge.clear_* it warns
    bridge_over_water_m: 25.0   # a ground edge over water this long in one stretch is an (unflagged) bridge
    profile_fair_passes: 50     # after grade_clamp: smooth the sawtooth on steep hills (then clamp again)
    conform_fit: {step_m: 2.0, passes: 20}   # road strip samples that fit the grid nodes to the road profile
    sun: {azimuth_deg: 315.0, altitude_deg: 45.0}
    shade_strength: 3.0         # z-factor on game slopes in the Chunk.shade channel only (1 = plain hillshade)
  lod: {grid_m: 32, chunks: 4, block_merge_m: 5.0, simplify_m: 4.0, parkland_height_m: 8.0}
slope_physics:
  gravity: 20.0                 # m/s² in game units
  slope_force_scale: 0.6
  suspension_travel: 0.5        # m the wheels follow the ground before the car flies
  hard_landing: 10.0            # m/s landing speed counted as hard (speed x 0.85, camera shake)

