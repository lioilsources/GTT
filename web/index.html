<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1C1C22" />
    <title>Metropole</title>
    <!-- App icon (specs/appicon.md): sunset by default; src/appicon rewrites both hrefs to the chosen mode. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/sunset-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/sunset-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link preview (Prompts/05 L-S8), filled at build time; og.png is 1200×627. -->
    <meta name="description" content="%OG_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:url" content="https://lioilsources.github.io/GTT/" />
    <meta property="og:image" content="https://lioilsources.github.io/GTT/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="world"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud">
      <div id="street" class="pill"></div>
      <div id="notice" class="pill notice" hidden></div>
      <div id="speed" class="pill"></div>
      <div id="terrain" class="pill" hidden></div>
      <div id="perf"></div>
      <div id="buttons">
        <button id="btn-scheme" class="round" type="button"></button>
        <button id="btn-night" class="round" type="button">◐</button>
        <button id="btn-camera" class="round" type="button"></button>
        <button id="btn-respawn" class="round" type="button">⟲</button>
      </div>
      <div id="about"></div>
    </div>
    <div id="loading" class="pill"></div>
    <div id="bench" hidden><pre id="bench-json"></pre><button id="bench-copy" class="round" type="button"></button></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
