// Citypack: the per-city world package produced by `citypack pack` and read by world_engine.
//
// Every file is a gzip-compressed protobuf message.
// Coordinates are local equirectangular metres from the manifest origin
// (x = Δlon·cos(lat0)·R, y = Δlat·R, y points north), stored as decimetres in sint32.
// Flat coordinate lists are interleaved: x0, y0, x1, y1, ...
syntax = "proto3";

package citypack;

option go_package = "citypack/internal/pb";

// manifest.pb
message Manifest {
  uint32 format_version = 1;
  string city_id = 2;
  string name = 3;
  double origin_lat = 4;
  double origin_lon = 5;
  string drive_side = 6;  // "right" | "left"
  string units = 7;       // "metric" | "imperial"
  string overture_release = 8;
  uint32 chunk_m = 9;
  Rect bounds = 10;               // dm
  repeated sint32 area = 11;      // playable area outer ring, dm
  repeated ChunkRef chunks = 12;
  Spawn start = 13;
  repeated District districts = 14;
  repeated string attribution = 15;
  string built_at = 16;
  // Terrain (specs/terrain.md, citypack v4). 0 or missing = flat pack: z = 0 everywhere.
  uint32 terrain_version = 17;
  float z0_m = 18;                 // real elevation of game height 0
  float exaggeration = 19;         // game height = (real − z0) × exaggeration
  uint32 terrain_grid_m = 20;      // Chunk.terrain step (8 → 33 × 33 per 256 m chunk)
  // Nature (specs/nature.md, citypack v4). 0 or missing = ground meshes carry no classes, no trees.
  uint32 nature_version = 21;
  repeated ChunkRef lods = 22;     // lod/{x}_{y}.pb; x, y = floor(chunk x, y / lod_chunks)
  uint32 lod_chunks = 23;          // chunks per lod tile edge (4)
  uint32 lod_grid_m = 24;          // Lod.terrain step (32 → 33 × 33 per tile)
}

message Rect {
  sint32 min_x = 1;
  sint32 min_y = 2;
  sint32 max_x = 3;
  sint32 max_y = 4;
}

// Chunk (x, y) covers [x*chunk_m, (x+1)*chunk_m) × [y*chunk_m, (y+1)*chunk_m) in metres.
message ChunkRef {
  sint32 x = 1;
  sint32 y = 2;
  uint32 bytes = 3;
  uint32 buildings = 4;
}

message Spawn {
  sint32 x = 1;
  sint32 y = 2;
  float heading_rad = 3;  // 0 = east, counter-clockwise
}

message District {
  string name = 1;
  repeated sint32 ring = 2;  // dm
}

enum RoadClass {
  ROAD_UNKNOWN = 0;
  MOTORWAY = 1;
  TRUNK = 2;
  PRIMARY = 3;
  SECONDARY = 4;
  TERTIARY = 5;
  RESIDENTIAL = 6;
  SERVICE = 7;
}

// graph.pb
message Graph {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
  repeated string names = 3;  // names[0] is always ""
}

message Node {
  sint32 x = 1;
  sint32 y = 2;
  bool border = 3;  // road leaves the playable area here: draw a roadblock
  sint32 z_dm = 4;  // game height (specs/terrain.md), 0 in a flat pack
}

message Edge {
  uint32 from = 1;
  uint32 to = 2;
  repeated sint32 points = 3;  // full polyline incl. both end nodes, dm
  RoadClass class = 4;
  uint32 name = 5;             // index into Graph.names
  uint32 lanes = 6;            // total, both directions
  sint32 oneway = 7;           // 0 two-way, 1 from→to only, -1 to→from only
  sint32 layer_from = 8;       // -1 tunnel, 0 ground, +1 bridge/overpass
  sint32 layer_to = 9;
  bool bridge = 10;
  bool tunnel = 11;
  bool kept = 12;              // false = alley: drivable, no traffic, no GPS
  float width_m = 13;          // lanes*lane_width + 2*sidewalk (alleys: no sidewalk)
  // Terrain: game height per vertex of `points` (same count); edges with relief are densified to
  // segments of at most 16 m. Empty in a flat pack.
  repeated sint32 z_dm = 14;
  bool stairs = 15;            // steeper than terrain.max_grade allows: a wall for cars
  bool micro_only = 16;        // alley narrower than flow.gap_close_m: micro vehicles only (bollards at both ends)
}

// chunks/{x}_{y}.pb
message Chunk {
  sint32 x = 1;
  sint32 y = 2;
  repeated Building buildings = 3;
  repeated Mesh ground = 4;
  repeated Barrier barriers = 5;  // bollard lines (specs/zones.md, micro_only alleys), layer 0
  // Terrain: 33 × 33 int16 little-endian game heights in dm, rows from the south, sample (i, j) at
  // (x·chunk_m + i·grid_m, y·chunk_m + j·grid_m); edges are shared with the neighbours.
  bytes terrain = 6;
  bytes shade = 7;                // 33 × 33 uint8 hillshade, 128 = flat, sun az 315°, alt 45°
  // Nature: 3 bytes per tree: x, y (uint8, metres from the chunk's south-west corner), then
  // size (low 2 bits: 0 S, 1 M, 2 L) | colour jitter << 2. Order = tree key index (specs/flow.md).
  bytes trees = 8;
  repeated Mesh shore = 9;        // shallow band inside water along the bank (kind WATER)
  repeated Label labels = 10;     // names of water > 2 ha and green > 1 ha, in the chunk of their midpoint
}

enum WaterClass {
  WATER_NONE = 0;
  WATER_SEA = 1;
  WATER_RIVER = 2;
  WATER_CANAL = 3;
  WATER_LAKE = 4;
  WATER_SMALL = 5;
}

enum GreenClass {
  GREEN_NONE = 0;
  GREEN_WOOD = 1;
  GREEN_PARKLAND = 2;
  GREEN_GARDEN = 3;
  GREEN_CEMETERY = 4;
  GREEN_GRASS = 5;
  GREEN_SAND = 6;
}

enum Surface {
  SURFACE_ASPHALT = 0;
  SURFACE_GRASS = 1;
  SURFACE_SAND = 2;
  SURFACE_DIRT = 3;
  SURFACE_FOREST = 4;
}

// A name drawn along an axis (water) or at a point (green: axis of one vertex).
message Label {
  string name = 1;
  repeated sint32 axis = 2;   // polyline, dm
  bool water = 3;             // false = green
  uint32 area_m2 = 4;         // whole body (the phone map sorts names by area)
}

// A bollard line: cars (not micro vehicles) collide with it as with a wall.
message Barrier {
  repeated sint32 points = 1;  // open polyline, dm
}

message Building {
  repeated sint32 rings = 1;      // all rings concatenated, dm
  repeated uint32 ring_ends = 2;  // exclusive end vertex index per ring; ring 0 outer (CCW), rest holes (CW)
  repeated uint32 roof = 3;       // triangle indices into the ring vertices
  float height_m = 4;
  float min_height_m = 5;         // > 0 for stacked building parts
  uint32 landmark = 6;            // 1-based index into Landmarks.items, 0 = none
  bool collide = 7;               // ground-touching masses get static colliders
  uint32 wall_seed = 8;           // seeds the facade tint and window scale
  sint32 base_z_dm = 9;           // terrain: lowest game height under the footprint
}

enum GroundKind {
  GROUND_UNKNOWN = 0;
  LAND = 1;
  WATER = 2;
  PARK = 3;
  RAIL = 4;
  PLAZA = 5;
  PEDESTRIAN = 6;  // pedestrian zone paving (specs/zones.md)
}

message Mesh {
  GroundKind kind = 1;
  repeated sint32 vertices = 2;  // dm
  repeated uint32 indices = 3;
  // Nature (specs/nature.md): WATER meshes carry a class, PARK meshes a green class and surface.
  WaterClass water_class = 4;
  GreenClass green_class = 5;
  Surface surface = 6;
  string name = 7;               // water body or park name, "" = unnamed
  sint32 z_dm = 8;               // water level (game height)
}

// lod/{x}_{y}.pb: the far ring of the chase camera (specs/terrain.md, specs/nature.md).
message Lod {
  sint32 x = 1;
  sint32 y = 2;
  bytes terrain = 3;             // 33 × 33 int16 LE dm, step Manifest.lod_grid_m, rows from the south
  repeated LodMass masses = 4;
  repeated Mesh water = 5;       // the tile's water as one surface
}

enum LodKind {
  LOD_BLOCK = 0;                 // buildings merged per block
  LOD_WOOD = 1;
  LOD_PARKLAND = 2;
}

message LodMass {
  LodKind kind = 1;
  repeated sint32 rings = 2;     // like Building
  repeated uint32 ring_ends = 3;
  repeated uint32 roof = 4;
  float height_m = 5;
  sint32 base_z_dm = 6;
}

// landmarks.pb
message Landmarks {
  repeated Landmark items = 1;
}

message Landmark {
  string id = 1;
  string name = 2;
  sint32 x = 3;  // label anchor, dm
  sint32 y = 4;
  float height_m = 5;
  bool hero = 6;
  string blurb = 7;
}

// spots.pb
message Spots {
  repeated Spot items = 1;
}

message Spot {
  string id = 1;
  string kind = 2;
  string name = 3;
  sint32 x = 4;
  sint32 y = 5;
  uint32 edge = 6;           // nearest kept edge
  sint32 park_x = 7;         // parking point on that edge, dm
  sint32 park_y = 8;
  float park_heading = 9;
  string minigame = 10;      // minigame id played here (content/minigames/catalog.yaml), empty = none
  sint32 look_x = 11;        // photo spots (specs/photo.md): the view to frame, dm
  sint32 look_y = 12;
  uint32 subject_dm = 13;    // radius of the view, dm
  // Nature: the park the spot is in, or the water within 150 m ("" = none); clients phrase
  // water as "by …" through i18n.
  string area_name = 14;
  bool area_water = 15;
}

// trams.pb (specs/trams.md): tram tracks as their own graph, always two-way, plus generated stops.
// A city without trams has an empty TramGraph (the file always exists from citypack v2 on).
message TramGraph {
  repeated Node nodes = 1;        // border = the track leaves the playable area
  repeated TramEdge edges = 2;
  repeated TramStop stops = 3;
}

message TramEdge {
  uint32 from = 1;
  uint32 to = 2;
  repeated sint32 points = 3;  // full polyline incl. both end nodes, dm
  sint32 layer_from = 4;       // -1 tunnel, 0 ground, +1 bridge
  sint32 layer_to = 5;
  bool bridge = 6;
  bool tunnel = 7;
}

message TramStop {
  uint32 edge = 1;
  float s_m = 2;  // distance from the edge's `from` end along its polyline
}
