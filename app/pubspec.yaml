dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  forge2d: ">=0.14.0 <0.15.2"
  rules_core:
    path: ../packages/rules_core

flutter:
  uses-material-design: true
  generate: true
  # City skins (specs/style.md): risograph pass over the world layer.
  shaders:
    - shaders/risograph.frag
  # Filled by `metro sync` (gitignored): run it before building.
  assets:
    - assets/shared/content/
    - assets/shared/content/cars/
    - assets/shared/content/bench/
    - assets/shared/content/quiz/
    - assets/shared/packs/nyc/
    - assets/shared/packs/nyc/chunks/
    - assets/shared/packs/prague/
    - assets/shared/packs/prague/chunks/
    - assets/shared/packs/tokyo/
    - assets/shared/packs/tokyo/chunks/
    - assets/shared/packs/moscow/
    - assets/shared/packs/moscow/chunks/
    # Generated art (specs/art.md); asset dirs are not recursive, one line per folder.
    - assets/shared/assets/
    - assets/shared/assets/npc/
    # NPC portraits per city (specs/art.md v4); New York uses the shared folder above.
    - assets/shared/assets/npc/prague/
    - assets/shared/assets/npc/tokyo/
    - assets/shared/assets/npc/moscow/
    - assets/shared/assets/postcards/nyc/
    - assets/shared/assets/postcards/prague/
    - assets/shared/assets/garage/decals/
    - assets/shared/assets/garage/wheels/
    - assets/shared/assets/ui/
