name: metropole
description: "Metropole – free driving through real world cities, one thumb, portrait."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flame: ^1.38.2
  yaml: ^3.1.4
  path_provider: ^2.1.5
  shared_gen:
    path: ../packages/shared_gen
  world_engine:
    path: ../packages/world_engine
  drive_core:
    path: ../packages/drive_core
  mg_api:
    path: ../packages/mg_api
  mg_sirky:
    path: ../packages/mg_sirky
  mg_oko:
    path: ../packages/mg_oko
  mg_dama:
    path: ../packages/mg_dama
  mg_desetitisic:
    path: ../packages/mg_desetitisic
  mg_sipky:
    path: ../packages/mg_sipky
  mg_koulena:
    path: ../packages/mg_koulena
  mg_kulicky:
    path: ../packages/mg_kulicky
  mg_cara:
    path: ../packages/mg_cara
  mg_nohejbal:
    path: ../packages/mg_nohejbal
  mg_strelnice:
    path: ../packages/mg_strelnice
  mg_taxi:
    path: ../packages/mg_taxi
  feed_hub:
    path: ../packages/feed_hub
  meta_progress:
    path: ../packages/meta_progress
  npc_dialogue:
    path: ../packages/npc_dialogue
  game_loop:
    path: ../packages/game_loop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  forge2d: ">=0.14.0 <0.15.2"
  rules_core:
    path: ../packages/rules_core

flutter:
  uses-material-design: true
  generate: true
  # Filled by `metro sync` (gitignored): run it before building.
  assets:
    - assets/shared/content/
    - assets/shared/content/cars/
    - assets/shared/content/bench/
    - assets/shared/packs/nyc/
    - assets/shared/packs/nyc/chunks/
    - assets/shared/packs/prague/
    - assets/shared/packs/prague/chunks/
